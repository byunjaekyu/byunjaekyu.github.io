<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYUN JAEKYU — Works</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.8 Arial,'Malgun Gothic',sans-serif;color:#222}a{color:inherit}header{padding:30px 4%;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #ddd}header strong{font-size:21px;font-weight:500}nav{display:flex;flex-wrap:wrap;gap:18px}nav a{text-decoration:none;font-size:12px}.layout{display:grid;grid-template-columns:25% minmax(0,1fr);gap:6%;padding:35px 4%}aside{position:sticky;top:20px;align-self:start;max-height:95vh;overflow:auto}aside button{display:block;background:none;border:0;text-align:left;padding:6px 0;cursor:pointer;font:13px/1.6 inherit;color:#666}aside button.active{font-weight:bold;color:#111}aside .year{display:block;margin-top:15px;color:#999;font-size:11px}main{max-width:900px}h1{font-size:28px;line-height:1.4;font-weight:500;margin:0}small{color:#777}.hero{margin-top:25px}img{width:100%;height:auto;display:block}figure{margin:32px 0}.hero-frame,.work-image--installation{width:100%;padding:20px 24px}.hero-frame{width:80%;margin:32px auto;padding:20px 0}.hero{margin:0;cursor:zoom-in}.work-image{min-width:0;margin:0}.work-image--detail-single{width:60%;margin:32px auto;padding:20px 0}.work-image--installation{margin:32px 0}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:32px 24px;align-items:start}.detail-grid .work-image{width:100%;padding:0}.work-image a,.hero-frame a{display:block;cursor:zoom-in}.work-image img{max-width:100%;height:auto}.work-image figcaption{margin-top:8px}.text-groups{margin-top:24px}.text-groups h2{font-size:15px;font-weight:500;margin:25px 0 7px}.text-groups ul{margin:0 0 18px;padding-left:18px}.text-groups li{margin:6px 0}@media(max-width:720px){.hero-frame{width:80%;padding:12px 0}.work-image--installation{padding:12px 10px}.work-image--detail-single{width:80%;padding:12px 0}.detail-grid{grid-template-columns:1fr;gap:28px;margin:28px 10px}}.editorial-text{max-width:700px;margin:44px auto 48px}.editorial-text p{margin:0 0 20px;line-height:2;white-space:normal}.editorial-text + .work-image--installation{margin-top:40px}.detail-grid + .editorial-text{margin-top:42px}@media(max-width:720px){.editorial-text{margin:30px auto 38px}.editorial-text p{line-height:1.9}}figcaption{font-size:11px;color:#777;margin-top:6px}p{line-height:1.95;white-space:pre-line}.video{aspect-ratio:16/9;width:100%;border:0}.section{display:none}.section.active{display:block}#work-content{display:block}#work-content.hidden{display:none}@media(max-width:720px){header{display:block;padding:20px}nav{margin-top:15px;gap:10px 16px}.layout{display:block;padding:20px}aside{position:static;max-height:220px;overflow:auto;border-bottom:1px solid #eee;margin-bottom:28px}h1{font-size:24px}}
/* Common artwork hierarchy: primary image/video larger than installation and details. */
.hero-frame{width:100%;max-width:100%;margin:32px auto;padding:0}
.work-image--installation{width:68%;max-width:100%;padding:0;margin:34px auto}
.work-image--detail-single{width:60%;max-width:100%;padding:0;margin:32px auto}
.detail-grid{width:72%;max-width:100%;margin:32px auto;gap:20px}
.video-frame{width:100%;margin:32px auto}
@media(max-width:720px){
 .hero-frame,.video-frame{width:100%}
 .work-image--installation{width:78%;padding:0;margin:26px auto}
 .work-image--detail-single{width:72%;padding:0;margin:26px auto}
 .detail-grid{width:80%;grid-template-columns:1fr;margin:26px auto;gap:26px}
}
 .video-external{display:flex;align-items:center;justify-content:center;min-height:220px;background:#191919;color:white;text-decoration:none;font-size:18px}.video-external:hover{text-decoration:underline}.video-note,.video-fallback{text-align:center;color:#666;font-size:12px} </style></head><body><header><strong>BYUN JAEKYU</strong><nav><a href="#works">Works</a><a href="#texts">Texts</a><a href="#about">About</a><a href="#cv">CV</a><a href="#contact">Contact</a></nav></header><div class="layout"><aside id="work-list" aria-label="Works"></aside><main><div id="work-content"></div><section class="section" id="texts"><h1>Texts</h1><div class="text-groups"><h2>Papers</h2><p>논문 목록을 추가할 예정입니다.</p><h2>Critical Texts</h2><p>평론가의 비평문을 추가할 예정입니다.</p><h2>Interviews</h2><p>인터뷰 자료를 추가할 예정입니다.</p></div></section><section class="section" id="about"><h1>About</h1><p>작가 소개를 추가할 예정입니다.</p></section><section class="section" id="cv"><h1>CV</h1><p>기존 홈페이지의 CV를 이곳에 이전할 예정입니다.</p></section><section class="section" id="contact"><h1>Contact</h1><p><a href="mailto:usagisang@gmail.com">usagisang@gmail.com</a></p><p><a href="https://vimeo.com/byunjaekyu" target="_blank" rel="noopener noreferrer">Vimeo ↗</a></p></section></main></div><script>
let works=[];const list=document.getElementById('work-list'),content=document.getElementById('work-content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function videoId(url){let m=String(url||'').match(/vimeo\.com\/(?:video\/)?(\d+)/);return m?m[1]:null}function render(){let id=decodeURIComponent(location.hash.slice(1));let section=['texts','about','cv','contact'].includes(id)?id:null;document.querySelectorAll('.section').forEach(e=>e.classList.toggle('active',e.id===section));content.classList.toggle('hidden',!!section);if(section)return;let work=works.find(w=>w.slug===id)||works[0];if(!work)return;content.dataset.work=work.slug;list.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.slug===work.slug));let vid=videoId(work.video);let videoExternal=!!vid&&work.video_embed===false;let hero=(!vid&&work.cover)?`<figure class="hero-frame"><a href="${esc(work.cover)}" target="_blank" rel="noopener" aria-label="대표사진 확대"><img class="hero" src="${esc(work.cover)}" alt="${esc(work.title)}"></a></figure>`:'';
const photoFigure=(im,cls)=>`<figure class="work-image ${cls}"><a href="${esc(im.file)}" target="_blank" rel="noopener" aria-label="사진 확대"><img loading="lazy" src="${esc(im.file)}" alt="${esc(im.caption||work.title)}"></a>${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:''}</figure>`;
let images='',queue=[];function flushPhotos(){if(!queue.length)return;if(queue.length===1){images+=photoFigure(queue[0],'work-image--detail-single')}else{for(let i=0;i<queue.length;i+=2){let pair=queue.slice(i,i+2);images+=pair.length===2?`<div class="detail-grid">${pair.map(im=>photoFigure(im,'work-image--detail')).join('')}</div>`:photoFigure(pair[0],'work-image--detail-single')}}queue=[]}
for(const im of (work.images||[]).filter(im=>im.file&&im.file!==work.cover)){let kind=String(im.type||'').toLowerCase(),fname=String(im.file||'').toLowerCase();let isInstallation=kind==='installation'||(!kind&&/installation|설치/.test(fname));if(isInstallation){flushPhotos();images+=photoFigure(im,'work-image--installation')}else{queue.push(im)}}flushPhotos();
const photoMap=new Map((work.images||[]).map(im=>[im.file,im]));
let editorial='';
if(Array.isArray(work.layout)&&work.layout.length){
 for(const block of work.layout){
  if(vid&&block.type==='image'&&block.file===work.cover)continue;
  if(block.type==='text'){editorial+=`<div class="editorial-text">${(block.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;}
  else if(block.type==='image'&&block.file){const im=photoMap.get(block.file)||{file:block.file};editorial+=photoFigure(im,im.type==='installation'?'work-image--installation':'work-image--detail-single');}
  else if(block.type==='image-pair'){editorial+=`<div class="detail-grid">${(block.files||[]).map(f=>photoFigure(photoMap.get(f)||{file:f},'work-image--detail')).join('')}</div>`;}
 }
}
content.innerHTML=`<h1>${esc(work.title)}</h1><small>${esc(work.medium||'')} · ${esc(work.display_year||work.year)}</small>${hero}${vid?(videoExternal?`<div class="video-frame"><a class="video-external" href="${esc(work.video)}" target="_blank" rel="noopener noreferrer">Vimeo에서 영상 재생 ↗</a><p class="video-note">Vimeo의 외부 사이트 재생 제한으로 영상 페이지에서 재생됩니다.</p></div>`:`<figure class="video-frame"><iframe class="video" src="https://player.vimeo.com/video/${vid}" title="${esc(work.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></figure><p class="video-fallback"><a href="${esc(work.video)}" target="_blank" rel="noopener noreferrer">재생되지 않으면 Vimeo에서 보기 ↗</a></p>`):''}${editorial||`<p>${esc(work.description||'')}</p>${images}`}${(work.links||[]).filter(x=>/^https?:\/\//.test(x.url||'')).map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label||x.url)} ↗</a></p>`).join('')}`}
fetch('works.json').then(r=>{if(!r.ok)throw Error('works.json not found');return r.json()}).then(data=>{works=data;list.innerHTML=works.map(w=>`<button data-slug="${esc(w.slug)}">${esc(w.title)}</button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>location.hash=b.dataset.slug);render()}).catch(e=>content.textContent=e.message);window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
</script></body></html>
