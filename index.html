<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>홈페이지 이미지·캡션 설정 적용</title><style>body{font:16px/1.8 Arial,'Malgun Gothic',sans-serif;max-width:720px;margin:50px auto;padding:20px;color:#222}h1{font-size:24px}input,button{font:inherit}button{padding:9px 18px;margin:12px 0;cursor:pointer}code{background:#eee;padding:2px 5px}#status{white-space:pre-wrap;color:#234}</style></head><body><h1>변재규 홈페이지 index.html 수정</h1><p>기존 <code>index.html</code>을 선택하면, 이미지 크기 설정은 유지하고 <code>caption_align</code> 및 <code>caption_position</code> 기능을 추가한 <code>index.html</code>을 내려받습니다. 기존 작품·문구는 변경하지 않습니다.</p><input id="file" type="file" accept=".html,text/html"><p><button id="go" disabled>수정된 index.html 만들기</button></p><pre id="status"></pre><script>
const file=document.getElementById('file'),btn=document.getElementById('go'),status=document.getElementById('status');file.onchange=()=>btn.disabled=!file.files.length;
btn.onclick=async()=>{try{
let s=await file.files[0].text();
if(s.includes('function captionedImage(image, caption, align')) {status.textContent='이미 캡션 위치 조절 기능이 있는 파일입니다.';return;}
const anchor='let vid=videoId(work.video);';
const helper=`function captionedImage(image, caption, align='right', position='bottom') {
  if (!caption) return image;
  const a=String(align||'right').toLowerCase();
  const safeAlign=['left','center','right'].includes(a)?a:'right';
  const label=\`<figcaption style="text-align:\${safeAlign}">\${esc(caption)}</figcaption>\`;
  return String(position||'bottom').toLowerCase()==='top'?label+image:image+label;
}
`;
if(!s.includes(anchor)) throw Error('이미지 출력 코드를 찾지 못했습니다. 최신 index.html 파일을 선택해 주세요.');
s=s.replace(anchor,helper+anchor);
const oldHero='<a href="${esc(work.cover)}" target="_blank" rel="noopener" aria-label="대표사진 확대"><img class="hero" src="${esc(work.cover)}" alt="${esc(work.title)}"></a>${coverCaption?`<figcaption>${esc(coverCaption)}</figcaption>`:\'\'}';
const newHero='${captionedImage(`<a href="${esc(work.cover)}" target="_blank" rel="noopener" aria-label="대표사진 확대"><img class="hero" src="${esc(work.cover)}" alt="${esc(work.title)}"></a>`,coverCaption,work.cover_caption_align||coverMeta.caption_align,work.cover_caption_position||coverMeta.caption_position)}';
const oldPhoto='<a href="${esc(im.file)}" target="_blank" rel="noopener" aria-label="사진 확대"><img loading="lazy" src="${esc(im.file)}" alt="${esc(im.caption||work.title)}"></a>${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:\'\'}';
const newPhoto='${captionedImage(`<a href="${esc(im.file)}" target="_blank" rel="noopener" aria-label="사진 확대"><img loading="lazy" src="${esc(im.file)}" alt="${esc(im.caption||work.title)}"></a>`,im.caption,im.caption_align,im.caption_position)}';
if(!s.includes(oldHero)||!s.includes(oldPhoto))throw Error('대표사진 또는 상세사진 출력 코드가 예상과 다릅니다. 원본은 변경하지 않았습니다.');
s=s.replace(oldHero,newHero).replace(oldPhoto,newPhoto);
s=s.replace('align:block.align||im.align}', 'align:block.align||im.align,caption_align:block.caption_align||im.caption_align,caption_position:block.caption_position||im.caption_position}');
s=s.replace('align:block.align||((photoMap.get(f)||{}).align)}','align:block.align||((photoMap.get(f)||{}).align),caption_align:block.caption_align||((photoMap.get(f)||{}).caption_align),caption_position:block.caption_position||((photoMap.get(f)||{}).caption_position)}');
const blob=new Blob([s],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);status.textContent='완료! 수정된 index.html을 다운로드했습니다. 기존 GitHub index.html을 교체하세요.';
}catch(e){status.textContent='수정하지 못했습니다: '+e.message;}};
</script></body></html>
