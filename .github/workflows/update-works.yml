name: Update Works from info.md
on:
  push:
    branches: [main]
    paths:
      - 'works/**/info.md'
      - 'scripts/enable_info_layout.py'
      - '.github/workflows/update-works.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing build dependency
        run: python -m pip install pyyaml
      - name: Upgrade artwork renderer without changing content
        run: python scripts/enable_info_layout.py
      - name: Rebuild artwork catalog from info.md
        run: python scripts/build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html works.json
          if ! git diff --cached --quiet; then
            git commit -m "Update artworks from info.md"
            git push
          fi
